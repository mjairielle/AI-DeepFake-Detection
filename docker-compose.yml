services:
  deepscan:
    build: .
    image: ai-deepfake-detection:latest
    container_name: deepscan-ai
    ports:
      - "${PORT:-5000}:5000"
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      DEBUG: "false"
    volumes:
      - ./learning_data:/app/learning_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
